<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerCompass.AI - AI Driven Career Advancement</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <style>
    body {
      font-family: 'Outfit', sans-serif;
      transition: background-color 0.3s, color 0.3s;
      cursor: none; /* Hide default cursor to use our custom animated one */
    }

    .dark {
      color-scheme: dark;
    }

    /* Custom scrollbar for better dark mode aesthetics */
    .dark ::-webkit-scrollbar {
      width: 8px;
    }

    .dark ::-webkit-scrollbar-track {
      background: #0f172a;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 10px;
    }

    .dark ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>

</head>

<body class="bg-gray-50 text-gray-900 dark:bg-slate-950 dark:text-gray-100 leading-relaxed">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
